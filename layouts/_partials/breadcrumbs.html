{{- if and (not .IsHome) .Parent (not .Parent.IsHome) }}
<nav class="breadcrumbs wrap" aria-label="Breadcrumb">
  <ol>
    <li><a href="/">Home</a></li>
    {{- range .Ancestors.Reverse }}{{ if not .IsHome }}<li><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>{{ end }}{{ end }}
    <li><a href="{{ .RelPermalink }}" aria-current="page">{{ .LinkTitle }}</a></li>
  </ol>
</nav>
{{- end }}
