{{- with .aside }}
<div class="card price-card">
  {{ with .kicker }}<p class="kicker">{{ . }}</p>{{ end }}
  <p class="price">{{ .price }}</p>
  {{ with .text }}<p>{{ . }}</p>{{ end }}
</div>
{{- else }}{{ with .image }}
<figure class="panel-photo">{{ partial "photo.html" (dict "image" . "sizes" "(width >= 56rem) 45vw, 100vw") }}</figure>
{{- else }}{{ with .art }}
<div class="panel-art" aria-hidden="true">{{ partial "art.html" . }}</div>
{{- end }}{{ end }}{{ end }}
